<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Helper - Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #00ff9d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            border: 2px solid #00ff9d;
            border-radius: 12px;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.2);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5em;
        }
        p {
            font-size: 1.3em;
            margin: 0;
            opacity: 0.9;
        }
        .status {
            margin-top: 30px;
            font-size: 1.1em;
            color: #00cc7a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Admin Helper</h1>
        <p>Bot está online e funcionando corretamente.</p>
        <div class="status">
            Página de administração carregada com sucesso
        </div>
    </div>
</body>
</html>
