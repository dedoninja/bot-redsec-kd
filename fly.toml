app = 'bot-redsec-kd'
primary_region = 'gru'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 256

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "data"
  destination = "/data"